            <div

              className="absolute bg-white rounded-full animate-snow-particle"
              style={{
                width: `${(i % 3) * 2 + 3}px`,
                height: `${(i % 3) * 2 + 3}px`,
                left: `${(i * 7.3) % 100}%`,
                top: `-${(i * 5) % 20}%`,
                animationDuration: `${((i % 4) + 5)}s`,
                animationDelay: `${(i * 0.4)}s`,
              }}
            />
          ))}
        </div>
      );
    };

    // --- 單一事件卡片元件 (支援觸控展開與打卡狀態保存) ---
    const MobileEventCard = ({ event }) => {
      const [isExpanded, setIsExpanded] = useState(false);
      const [isDone, setIsDone] = useState(() => {
        return localStorage.getItem(`done_${event.id}`) === 'true';
      });

      const handleToggleDone = (e) => {
        e.stopPropagation();
        const nextState = !isDone;
        setIsDone(nextState);
        localStorage.setItem(`done_${event.id}`, String(nextState));
      };

      const Icon = event.icon;

      return (
        <div className={`relative pl-7 pb-4 ${isDone ? 'opacity-55' : 'opacity-100'} transition-all duration-200`}>
          {/* 時間軸導軌 */}
          <div className="absolute left-2.5 top-3 -bottom-1 w-0.5 bg-blue-100"></div>

          {/* 打卡完成按鈕 */}
          <button 
            type="button"
            aria-label="標記完成"
            onClick={handleToggleDone}
            className="absolute left-0 top-2 z-10 p-0.5 rounded-full bg-white active:scale-95 transition-transform"
          >
            {isDone ? (
              <CheckCircleIcon className="w-5 h-5 text-emerald-500 fill-emerald-50" />
            ) : (
              <CircleIcon className="w-5 h-5 text-blue-300 hover:text-blue-500 transition-colors" />
            )}
          </button>

          {/* 卡片本體 */}
          <div 
            className={`bg-white rounded-xl border transition-all ${
              isDone ? 'border-emerald-200 bg-emerald-50/20' : 'border-slate-100 shadow-[0_2px_8px_-2px_rgba(0,0,0,0.06)]'
            } overflow-hidden`}
          >
            <div 
              onClick={() => setIsExpanded(!isExpanded)}
              className="p-3 active:bg-slate-50 transition-colors cursor-pointer select-none"
            >
              <div className="flex items-center justify-between gap-2">
                <div className="flex items-center gap-2.5 min-w-0">
                  <div className={`p-1.5 rounded-lg shrink-0 border ${event.bg} ${event.color}`}>
                    <Icon className="w-4 h-4" />
                  </div>
                  <div className="min-w-0">
                    <div className="flex items-center gap-2">
                      <span className="text-base font-black font-mono text-slate-800 tracking-tight">{event.time}</span>
                      {(event.transport || event.logistics) && !isExpanded && (
                        <span className="inline-block w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                      )}
                    </div>
                    <h3 className={`text-sm font-bold leading-snug mt-0.5 truncate ${isDone ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                      {event.title}
                    </h3>
                  </div>
                </div>
                
                <div className="text-slate-400 shrink-0 p-1">
                  {isExpanded ? <ChevronUpIcon className="w-4 h-4" /> : <ChevronDownIcon className="w-4 h-4" />}
                </div>
              </div>
            </div>

            {/* 展開抽屜區塊 */}
            {isExpanded && (
              <div className="px-3 pb-3 pt-1 border-t border-slate-100 text-xs text-slate-600 space-y-2 bg-slate-50/50">
                {event.transport && (
                  <div className="bg-indigo-50/80 p-2.5 rounded-lg border border-indigo-100/80">
                    <div className="flex items-center gap-1 font-bold text-indigo-800 mb-0.5">
                      <TrainIcon className="w-3.5 h-3.5 shrink-0" />
                      <span>交通動線</span>
                    </div>
                    <p className="text-slate-700 leading-relaxed pl-4">{event.transport}</p>
                  </div>
                )}

                {event.logistics && (
                  <div className="bg-rose-50/80 p-2.5 rounded-lg border border-rose-100/80">
                    <div className="flex items-center gap-1 font-bold text-rose-800 mb-0.5">

                    </div>
                    <p className="text-slate-700 leading-relaxed pl-4">{event.logistics}</p>
                  </div>
                )}

                {event.details && event.details.length > 0 && (
                  <div className="bg-white p-2.5 rounded-lg border border-slate-100 space-y-1.5">
                    {event.details.map((detail, idx) => (
                      <div key={idx} className="flex items-start gap-1.5 leading-relaxed">
                        <span className="text-blue-400 font-bold shrink-0">•</span>
                        <span className="break-words">{detail}</span>
                      </div>
                    ))}
                  </div>
                )}

                {event.mapLink && (
                  <div className="pt-1">
                    <a 
                      href={event.mapLink} 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="flex items-center justify-center gap-1.5 w-full py-2 px-3 text-xs font-bold text-blue-600 bg-blue-50/90 active:bg-blue-100 rounded-lg border border-blue-200"

                      <span>開啟 Google 地圖路線導航</span>
                      <ExternalLinkIcon className="w-3 h-3 text-blue-400" />
                    </a>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    };

            {/* 主要行程清單區 */}
            <main className="flex-1 p-3.5">

              </div>

              <div className="relative">
                {currentDayData.events.map((event) => (
                  <MobileEventCard key={event.id} event={event} />

                <div className="absolute left-2 -bottom-1 w-2 h-2 rounded-full bg-slate-300"></div>
              </div>

              <div className="mt-6 mb-2 p-3 bg-blue-50/70 border border-blue-100 rounded-xl text-center text-xs text-slate-500 leading-relaxed">
                ❄️ 戶外嚴寒積雪，請隨身攜帶手套防滑帽。<br/>
                📱 點擊左側圈圈可打卡，記錄會自動儲存於手機！
              </div>
            </main>

            {/* 手機底部懸浮導航列 (支援 iPhone 底部黑條安全區 pb-safe) */}
            <nav className="fixed bottom-0 left-0 right-0 z-50 flex justify-center pointer-events-none">
              <div className="w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-200 px-2 pt-2 pb-safe flex items-center justify-around shadow-2xl pointer-events-auto">
                {itineraryData.map((d) => {
                  const isActive = activeDay === d.day;
                  return (
                    <button
                      key={d.day}
                      type="button"
                      onClick={() => {
                        setActiveDay(d.day);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                      }}
                      className={`flex flex-col items-center justify-center py-1 px-2.5 rounded-xl transition-all ${
                        isActive 
                          ? 'bg-blue-600 text-white font-black shadow-sm scale-105' 
                          : 'text-slate-500 hover:text-slate-800 active:bg-slate-100 font-medium'
                      }`}
                    >
                      <span className="text-xs">Day {d.day}</span>
                      <span className={`text-[10px] ${isActive ? 'text-blue-100' : 'text-slate-400'}`}>
                        {d.shortDate.split(' ')[0]}
                      </span>
                    </button>
                  );
                })}
              </div>
            </nav>

          </div>
        </div>
      );
    }

    // 渲染至網頁 DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
